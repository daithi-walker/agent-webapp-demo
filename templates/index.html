<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validate</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; font-size: 1rem; }
    button { margin-top: .5rem; padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1rem; padding: .75rem; border-radius: 4px; display: none; }
    #result.valid   { background: #d4edda; color: #155724; }
    #result.invalid { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <h1>Positive Integer Validator</h1>
  <p>Submit any number to check whether it is a positive whole number (greater than zero). Results are saved and displayed in the history table below.</p>

  <form id="form">
    <label for="value">Value</label><br>
    <input id="value" type="number" name="value" required placeholder="e.g. 42">
    <small>Must be a whole number greater than zero</small>
    <button type="submit">Submit</button>
  </form>
  <div id="result" role="status"></div>

  <div style="margin-top:1.5rem;display:flex;align-items:center;gap:.75rem;">
    <strong>History</strong>
    <button type="button" id="refresh-btn" style="font-size:.8rem;padding:.25rem .6rem;">Refresh</button>
  </div>
  <section id="history" style="margin-top:.5rem;"></section>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('result');

      try {
        const res = await fetch('/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ value: parseInt(document.getElementById('value').value, 10) }),
        });
        const data = await res.json();
        result.textContent = data.reason ?? (data.valid ? 'Valid' : 'Invalid');
        result.className = data.valid ? 'valid' : 'invalid';
      } catch {
        result.textContent = 'Request failed.';
        result.className = 'invalid';
      }

      result.style.display = 'block';
    });

    async function loadHistory() {
      const section = document.getElementById('history');
      try {
        const res = await fetch('/history');
        const data = await res.json();
        if (!Array.isArray(data.history) || data.history.length === 0) {
          section.innerHTML = '<p>No history found.</p>';
          return;
        }
        const rows = data.history.map(r => `<tr>
          <td style="padding:.4rem .6rem;border:1px solid #ccc;">${r.timestamp ?? ''}</td>
          <td style="padding:.4rem .6rem;border:1px solid #ccc;">${r.value ?? ''}</td>
          <td style="padding:.4rem .6rem;border:1px solid #ccc;">${r.valid ? 'Valid' : 'Invalid'}</td>
          <td style="padding:.4rem .6rem;border:1px solid #ccc;">${r.reason ?? ''}</td>
        </tr>`).join('');
        section.innerHTML = `<table style="width:100%;border-collapse:collapse;font-size:.9rem;">
          <thead><tr>
            <th style="padding:.4rem .6rem;border:1px solid #ccc;text-align:left;">Timestamp</th>
            <th style="padding:.4rem .6rem;border:1px solid #ccc;text-align:left;">Value</th>
            <th style="padding:.4rem .6rem;border:1px solid #ccc;text-align:left;">Valid</th>
            <th style="padding:.4rem .6rem;border:1px solid #ccc;text-align:left;">Reason</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      } catch {
        section.innerHTML = '<p style="color:#721c24;">Failed to load history.</p>';
      }
    }

    document.getElementById('refresh-btn').addEventListener('click', loadHistory);

    document.addEventListener('DOMContentLoaded', loadHistory);
  </script>
</body>
</html>
